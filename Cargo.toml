[package]
name = "embarch-umbrella"
version = "0.1.0"
edition = "2021"

# The repo is embarch-umbrella; the binary is `embarch` — it's the most-typed
# command in the suite for someone who has never used it before
# (../embarch-doc/embarch-umbrella/design.md §3 decision 2).
[[bin]]
name = "embarch"
path = "src/main.rs"

# Deliberately absent, and expected to stay absent: probe-rs and serialport.
# Umbrella holds no hardware knowledge — every hardware-facing capability is a
# shell-out to embarch-core or an HTTP call to its endpoints (design.md §1).
[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Expected next, when there's behavior to need them (milestone-6.md §3.2–§3.4):
# reqwest (rustls, no native-tls) for the /status candidate race, serde +
# serde_json for `--json` output, toml for writing embarch-api's config.
