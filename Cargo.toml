[package]
name = "embarch-umbrella"
version = "0.1.0"
edition = "2021"

# The repo is embarch-umbrella; the binary is `embarch` — it's the most-typed
# command in the suite for someone who has never used it before
# (../embarch-doc/embarch-umbrella/design.md §3 decision 2).
[[bin]]
name = "embarch"
path = "src/main.rs"

# Deliberately absent, and expected to stay absent: probe-rs and serialport.
# Umbrella holds no hardware knowledge — every hardware-facing capability is a
# shell-out to embarch-core or an HTTP call to its endpoints (design.md §1).
[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
# rustls rather than native-tls, matching embarch-api: no system OpenSSL
# dependency, so this stays trivially buildable wherever Core happens to run.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"
tokio = { version = "1.53.0", features = ["macros", "rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

