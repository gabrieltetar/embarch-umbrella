[package]
name = "embarch-umbrella"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The repo is embarch-umbrella; the binary is `embarch` — it's the most-typed
# command in the suite for someone who has never used it before
# (decision 2).
[[bin]]
name = "embarch"
path = "src/main.rs"

# Deliberately absent, and expected to stay absent: probe-rs and serialport.
# Umbrella holds no hardware knowledge, with one exception: doctor check 5
# reads world-readable /sys/bus/usb/devices sysfs attributes in-process (no
# probe-rs, no permission needed) — embarch-umbrella decision 18, in
# ../embarch-doc/embarch-umbrella/decisions/doctor.md. Every other
# hardware-facing capability is a shell-out to embarch-core or an HTTP call to
# its endpoints (../embarch-doc/embarch-umbrella/spec.md, "Not:").
[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
# `embarch-topology` decisions 2, 3, 4, 6: software-topology
# detection (formerly this crate's own topology.rs/env.rs/probe.rs, and
# `doctor`'s topology-relevant checks) now calls this shared crate live,
# in-process. No `features = ["hardware"]` — this crate never touches
# probe-rs/serialport (see this file's own "deliberately absent" comment
# below, which stays true with this dependency in place).
embarch-topology = { path = "../embarch-topology" }
# ../embarch-doc/embarch-umbrella/decisions/doctor.md 33: `doctor`'s check 11
# needs a host-type schema version to compare Core's served one against, and
# the only honest local source of one is this constant. Default features only
# — the `std`/`gatt-extract`/`study-ui` halves are authoring-time tools this
# crate never touches, so this stays a types-only dependency and pulls in no
# hardware. Nothing else in this crate links a study type.
embarch-study-designer = { path = "../embarch-study-designer" }
# ../embarch-doc/embarch-umbrella/decisions/mirrors.md 20 (amended
# 2026-09-08): the token fallback chain (formerly this crate's own
# token.rs) now calls this shared crate live, in-process, rather than
# carrying a hand-kept copy. Only `embarch_core_client::token_discovery`
# is used here; nothing else in this crate calls into it. Cargo unifies
# its `reqwest`/`tokio` features with this crate's own below — `bytes` and
# tokio's `sync`/`fs`/`process` grow in as a result, but `probe-rs` and
# `serialport` stay absent (verified via `cargo tree`), so this file's
# "deliberately absent" comment above stays true.
embarch-core-client = { path = "../embarch-api/crates/embarch-core-client" }
# rustls rather than native-tls, matching embarch-api: no system OpenSSL
# dependency, so this stays trivially buildable wherever Core happens to run.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
# embarch-umbrella decision 33 (deploy.md, amendment): `deploy-core`'s own
# landed-check has to compare file content, not length — a release rebuild of
# one constant, or a rename-only change, produces two builds the same size.
# Pure Rust, no system OpenSSL, matching this crate's rustls choice above.
sha2 = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
toml = "1.1"
tokio = { version = "1.53.0", features = ["macros", "rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Real per-user PATH mutation (decision 28) needs the registry
# on Windows only — HKCU\Environment, no elevation required.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

