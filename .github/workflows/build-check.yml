# Builds the four release targets on every branch push, the way release.yml
# does, and uploads nothing (EMB-192). It exists because `verify-release`
# added `aws-lc-sys`, a C and cmake build, to `embarch`: the aarch64 cross leg
# is where that could fail, and release.yml only runs on a tag. Cuts no release.
name: Build check

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    # Sibling path dependencies, as in release.yml: this repo has to sit in a
    # same-named directory beside them.
    defaults:
      run:
        working-directory: embarch-umbrella
    steps:
      - uses: actions/checkout@v4
        with:
          path: embarch-umbrella
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-topology
          path: embarch-topology
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-study-designer
          path: embarch-study-designer
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-api
          path: embarch-api

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.linker
        # aws-lc-sys compiles C for the target, so it needs the cross compiler
        # (gcc-aarch64-linux-gnu brings both gcc and the sysroot headers).
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.linker }}" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
            export CC_aarch64_unknown_linux_gnu="${{ matrix.linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}
