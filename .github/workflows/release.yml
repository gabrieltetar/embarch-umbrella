# Release CI for embarch-umbrella's own binary, `embarch`
# (embarch-umbrella/milestone-6.md §3.7).
#
# Same shape as embarch-api's release.yml — no C dependency, so
# aarch64-unknown-linux-gnu only needs a cross-linker, not `cross`. This is
# embarch-umbrella's *own* release, one component's binary; the combined
# suite archive is a separate workflow (assemble-suite.yml) that pulls this
# one plus embarch-core's and embarch-api's tagged releases together.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  BIN: embarch

permissions:
  contents: write

jobs:
  # embarch-umbrella decisions 27/29: no release may build a binary whose
  # `--version` disagrees with the tag that produced it. This job gates the
  # build matrix, so a mismatch costs one ubuntu runner-minute rather than
  # four cross-compiles and an uploaded asset — the decision's "failing the
  # release outright" rather than catching it afterwards. `doctor` check 1
  # compares installed binaries against the suite manifest and therefore
  # inherits this gap; it can only detect a mismatch that got shipped.
  #
  # Deliberately toolchain-free: it reads `[package] version` out of
  # Cargo.toml with awk rather than `cargo metadata`, because this repo's
  # manifest has sibling path dependencies that only resolve once the other
  # checkouts exist — and the point is to fail before any of that setup runs.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml version must match the pushed tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ref $GITHUB_REF_NAME is not a tag (workflow_dispatch); nothing to compare"
            exit 0
          fi
          version=$(awk -F'"' '
            /^\[package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not read [package] version from Cargo.toml"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Cargo.toml version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Cargo.toml $version matches tag $GITHUB_REF_NAME"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    # Cargo.toml depends on embarch-topology as a sibling path dependency
    # (DOC-PROTOCOL.md §2's layout — no Cargo workspace); unlike
    # embarch-core/embarch-api, this crate has no embarch-study-designer
    # dependency. `../embarch-topology` only resolves if this repo's own
    # checkout also sits in a same-named sibling directory rather than at
    # the workspace root — same fix as embarch-core's/embarch-api's own
    # release.yml, for the same latent gap.
    defaults:
      run:
        working-directory: embarch-umbrella
    steps:
      - uses: actions/checkout@v4
        with:
          path: embarch-umbrella
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-topology
          path: embarch-topology

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.linker }}" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ matrix.target }}"
          bin="${BIN}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${BIN}.exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
            # `working-directory: embarch-umbrella` only applies to `run:`
            # steps, not the `uses:` upload step below.
            echo "asset=embarch-umbrella/dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=embarch-umbrella/dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
