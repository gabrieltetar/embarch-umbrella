# Release CI for embarch-umbrella's own binary, `embarch`
# (embarch-umbrella/milestone-6.md §3.7).
#
# Same shape as embarch-api's release.yml — no C dependency, so
# aarch64-unknown-linux-gnu only needs a cross-linker, not `cross`. This is
# embarch-umbrella's *own* release, one component's binary; the combined
# suite archive is a separate workflow (assemble-suite.yml) that pulls this
# one plus embarch-core's and embarch-api's tagged releases together.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  BIN: embarch

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    # Cargo.toml depends on embarch-topology as a sibling path dependency
    # (DOC-PROTOCOL.md §2's layout — no Cargo workspace); unlike
    # embarch-core/embarch-api, this crate has no embarch-study-designer
    # dependency. `../embarch-topology` only resolves if this repo's own
    # checkout also sits in a same-named sibling directory rather than at
    # the workspace root — same fix as embarch-core's/embarch-api's own
    # release.yml, for the same latent gap.
    defaults:
      run:
        working-directory: embarch-umbrella
    steps:
      - uses: actions/checkout@v4
        with:
          path: embarch-umbrella
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-topology
          path: embarch-topology

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.linker }}" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ matrix.target }}"
          bin="${BIN}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${BIN}.exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
            # `working-directory: embarch-umbrella` only applies to `run:`
            # steps, not the `uses:` upload step below.
            echo "asset=embarch-umbrella/dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=embarch-umbrella/dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
