# Release CI for embarch-umbrella's own binary, `embarch`
# (embarch-umbrella decision 14).
#
# Same shape as embarch-api's release.yml — no C dependency, so
# aarch64-unknown-linux-gnu only needs a cross-linker, not `cross`. This is
# embarch-umbrella's *own* release, one component's binary; the combined
# suite archive is a separate workflow (assemble-suite.yml) that pulls this
# one plus embarch-core's and embarch-api's tagged releases together.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  BIN: embarch

# The build jobs get no `id-token` and no write scope: they only compile and
# upload workflow artifacts. The one `sign` job below holds both, so a release
# is one approval of the `release` environment and signing never runs next to
# the toolchain steps.
permissions:
  contents: read

jobs:
  # embarch-umbrella decisions 27/29: no release may build a binary whose
  # `--version` disagrees with the tag that produced it. This job gates the
  # build matrix, so a mismatch costs one ubuntu runner-minute rather than
  # four cross-compiles and an uploaded asset — the decision's "failing the
  # release outright" rather than catching it afterwards. `doctor` check 1
  # compares installed binaries against the suite manifest and therefore
  # inherits this gap; it can only detect a mismatch that got shipped.
  #
  # Deliberately toolchain-free: it reads `[package] version` out of
  # Cargo.toml with awk rather than `cargo metadata`, because this repo's
  # manifest has sibling path dependencies that only resolve once the other
  # checkouts exist — and the point is to fail before any of that setup runs.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml version must match the pushed tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ref $GITHUB_REF_NAME is not a tag (workflow_dispatch); nothing to compare"
            exit 0
          fi
          version=$(awk -F'"' '
            /^\[package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not read [package] version from Cargo.toml"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Cargo.toml version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Cargo.toml $version matches tag $GITHUB_REF_NAME"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    # Cargo.toml depends on embarch-topology, embarch-study-designer, and
    # embarch-api (for crates/embarch-core-client) as sibling path
    # dependencies (DOC-PROTOCOL.md §2's layout — no Cargo workspace). Each
    # only resolves if this repo's own checkout also sits in a same-named
    # sibling directory rather than at the workspace root — same fix as
    # embarch-core's/embarch-api's own release.yml, for the same latent gap.
    defaults:
      run:
        working-directory: embarch-umbrella
    steps:
      - uses: actions/checkout@v4
        with:
          path: embarch-umbrella
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-topology
          path: embarch-topology
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-study-designer
          path: embarch-study-designer
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-api
          path: embarch-api
      # embarch-api's embarch-core-client path-depends on embarch-core's wire
      # crate (crates/embarch-core-wire, api decision 49).
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-core
          path: embarch-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.linker }}" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ matrix.target }}"
          bin="${BIN}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${BIN}.exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
            # `working-directory: embarch-umbrella` only applies to `run:`
            # steps, not the `uses:` upload step below.
            echo "asset=embarch-umbrella/dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=embarch-umbrella/dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # Signs and publishes every archive. No signing step lives in a reusable
  # workflow: the certificate identity names the workflow that ran `cosign`,
  # and it must be this file (`assemble-suite.yml` verifies exactly
  # `.../embarch-umbrella/.github/workflows/release.yml@refs/tags/<tag>`).
  sign:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.0.4
      - name: Sign every archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no archives were downloaded"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      - name: Publish archives and bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sigstore.json
          fail_on_unmatched_files: true
